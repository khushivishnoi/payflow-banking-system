spring.application.name=transaction-service
server.port=8083

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/transactions_db
spring.datasource.username=root
spring.datasource.password=payflow123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# JWT
jwt.secret=payflow-super-secret-key-for-hmac-sha-256-algorithm-minimum-32-bytes-long-enough

# Service URLs
account-service.url=http://localhost:8082

# Outbox poller
outbox.poller.fixed-delay=5000
